      control:
        recovery_deadline_s: 120
        stability_window_s: 60
        max_restarts: 1
      safety:
        allow_shell: true
    metadata:
      difficulty: medium
    setup:
      upf: "/scripts/apply-service-class-qos.sh /etc/open5gs/service-classes-demoted.yaml"

  - id: three_slice_premium_lossy
