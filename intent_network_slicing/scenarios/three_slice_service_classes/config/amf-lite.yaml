logger:
  file:
    path: /opt/open5gs/var/log/open5gs/amf.log
  level: info

global:
  max:
    ue: 1024

amf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: amf
    client:
      nrf:
        - uri: http://nrf:7777

  ngap:
    server:
      - address: 0.0.0.0
        port: 38412

  metrics:
    server:
      - address: 0.0.0.0
        port: 9090

  guami:
    - plmn_id:
        mcc: 999
        mnc: 70
      amf_id:
        region: 2
        set: 1

  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1

  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1
          sd: 000001

  security:
    integrity_order: [NIA0]
    ciphering_order: [NEA0]

  network_name:
    full: Open5GS Test Network (Lite)
    short: Open5GS

  amf_name: open5gs-amf-lite

  time:
    t3502:
      value: 720
    t3512:
      value: 3600
