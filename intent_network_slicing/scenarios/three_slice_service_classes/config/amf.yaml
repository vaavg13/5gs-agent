logger:
  level: info
  file: /opt/open5gs/var/log/open5gs/amf.log
sbi:
  server:
    no_tls: true
  client:
    no_tls: true
nrf:
  sbi:
  - addr: nrf
    port: 7777
amf:
  sbi:
  - addr: amf
    port: 7777
  ngap:
  - addr: 0.0.0.0
    port: 38412
  metrics:
  - addr: 0.0.0.0
    port: 9090
  guami:
  - plmn_id:
      mcc: 999
      mnc: 70
    amf_id:
      region: 2
      set: 1
  tai:
  - plmn_id:
      mcc: 999
      mnc: 70
    tac: 1
  plmn_support:
  - plmn_id:
      mcc: 999
      mnc: 70
    s_nssai:
    - sst: 1
      sd: 000001
    - sst: 1
      sd: 000002
    - sst: 1
      sd: 000003
  security:
    integrity_order:
    - NIA2
    - NIA1
    - NIA0
    ciphering_order:
    - NEA0
    - NEA1
    - NEA2
  network_name:
    full: Open5GS Test Network
    short: Open5GS
  amf_name: open5gs-amf
