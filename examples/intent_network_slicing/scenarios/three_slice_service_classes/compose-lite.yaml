# Open5GS 5G SA Stack - Minimal Deployment (~2GB RAM)
# Only essential NFs: NRF, AMF, SMF, UPF + UERANSIM
# Authentication disabled (test mode only)

services:
  nrf:
    image: openverso/open5gs:2.6.4
    container_name: ${COMPOSE_PROJECT_NAME:-open5gs_lite}-nrf
    hostname: nrf
    command: open5gs-nrfd
    volumes:
      - ./config/nrf.yaml:/etc/open5gs/nrf.yaml:ro
    networks:
      open5gs:
        ipv4_address: 10.45.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7777/nnrf-nfm/v1/nf-instances || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  amf:
    image: openverso/open5gs:2.6.4
    container_name: ${COMPOSE_PROJECT_NAME:-open5gs_lite}-amf
    hostname: amf
    command: open5gs-amfd
    depends_on:
      nrf:
        condition: service_healthy
    volumes:
      - ./config/amf-lite.yaml:/etc/open5gs/amf.yaml:ro
    ports:
      - "9090:9090"
    networks:
      open5gs:
        ipv4_address: 10.45.0.11
    healthcheck:
      test: ["CMD-SHELL", "netstat -tlnp 2>/dev/null | grep -q 38412 || ss -tlnp | grep -q 38412"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  smf:
    image: openverso/open5gs:2.6.4
    container_name: ${COMPOSE_PROJECT_NAME:-open5gs_lite}-smf
    hostname: smf
    command: open5gs-smfd
    depends_on:
      nrf:
        condition: service_healthy
    volumes:
      - ./config/smf.yaml:/etc/open5gs/smf.yaml:ro
    ports:
      - "9091:9091"
    networks:
      open5gs:
        ipv4_address: 10.45.0.12
    healthcheck:
      test: ["CMD-SHELL", "netstat -tlnp 2>/dev/null | grep -q 8805 || ss -tlnp | grep -q 8805"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  upf:
    image: openverso/open5gs:2.6.4
    container_name: ${COMPOSE_PROJECT_NAME:-open5gs_lite}-upf
    hostname: upf
    command: open5gs-upfd
    depends_on:
      smf:
        condition: service_healthy
    volumes:
      - ./config/upf.yaml:/etc/open5gs/upf.yaml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      open5gs:
        ipv4_address: 10.45.0.13
    healthcheck:
      test: ["CMD-SHELL", "ip link show ogstun 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  gnb:
    image: free5gc/ueransim:v4.2.0-aarch64
    container_name: ${COMPOSE_PROJECT_NAME:-open5gs_lite}-gnb
    hostname: gnb
    command: nr-gnb -c /etc/ueransim/gnb.yaml
    depends_on:
      amf:
        condition: service_healthy
    volumes:
      - ./config/gnb.yaml:/etc/ueransim/gnb.yaml:ro
    cap_add:
      - NET_ADMIN
    networks:
      open5gs:
        ipv4_address: 10.45.0.20

  ue:
    image: free5gc/ueransim:v4.2.0-aarch64
    container_name: ${COMPOSE_PROJECT_NAME:-open5gs_lite}-ue
    hostname: ue
    command: nr-ue -c /etc/ueransim/ue.yaml
    depends_on:
      - gnb
    volumes:
      - ./config/ue-lite.yaml:/etc/ueransim/ue.yaml:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      open5gs:
        ipv4_address: 10.45.0.21

networks:
  open5gs:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
