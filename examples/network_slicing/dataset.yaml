# Network Slicing Dataset
# Each sample defines a scenario with SLA requirements and optional impairments

prompt_template: |
  Configure the 5G network to meet the VR gaming SLA requirements.

  Target SLA:
  - Uplink throughput: ≥50 Mbps
  - Downlink throughput: ≥100 Mbps
  - Latency: ≤20ms
  - Jitter: ≤5ms
  - Packet loss: ≤0.1%

  Start by checking the current network configuration and UE status.

samples:
  - id: vr_gaming_baseline
    input: |
      Configure the 5G network to meet the VR gaming SLA requirements.

      Target SLA:
      - Uplink throughput: ≥50 Mbps
      - Downlink throughput: ≥100 Mbps
      - Latency: ≤20ms
      - Jitter: ≤5ms
      - Packet loss: ≤0.1%

      Start by checking the current network configuration and UE status.
    target: "Configure slice and verify SLA compliance"
    sandbox: [open5gs, "vr_gaming/compose.yaml"]
    metadata:
      difficulty: easy
      expected_metrics:
        uplink_throughput_mbps: 50
        downlink_throughput_mbps: 100
        max_latency_ms: 20
        max_jitter_ms: 5
        max_packet_loss_pct: 0.1

  - id: vr_gaming_latency_impaired
    input: |
      The VR gaming slice is experiencing degraded performance. Users report sluggish responsiveness.

      Target SLA:
      - Uplink throughput: ≥50 Mbps
      - Downlink throughput: ≥100 Mbps
      - Latency: ≤20ms
      - Jitter: ≤5ms
      - Packet loss: ≤0.1%

      Diagnose the issue and restore SLA compliance.
    target: "All SLA metrics within target thresholds"
    sandbox: [open5gs, "vr_gaming/compose.yaml"]
    metadata:
      difficulty: medium
      expected_metrics:
        uplink_throughput_mbps: 50
        downlink_throughput_mbps: 100
        max_latency_ms: 20
        max_jitter_ms: 5
        max_packet_loss_pct: 0.1
    setup:
      upf: "tc qdisc add dev ogstun root netem delay 100ms 10ms"

  - id: vr_gaming_packet_loss
    input: |
      The VR gaming slice is experiencing degraded quality. Users report stuttering and dropped frames.

      Target SLA:
      - Uplink throughput: ≥50 Mbps
      - Downlink throughput: ≥100 Mbps
      - Latency: ≤20ms
      - Jitter: ≤5ms
      - Packet loss: ≤0.1%

      Diagnose the issue and restore SLA compliance.
    target: "All SLA metrics within target thresholds"
    sandbox: [open5gs, "vr_gaming/compose.yaml"]
    metadata:
      difficulty: medium
      expected_metrics:
        uplink_throughput_mbps: 50
        downlink_throughput_mbps: 100
        max_latency_ms: 20
        max_jitter_ms: 5
        max_packet_loss_pct: 0.1
    setup:
      upf: "tc qdisc add dev ogstun root netem loss 5%"
